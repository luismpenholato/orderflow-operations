# OrderFlow Operations — nginx site configuration
# Place in /etc/nginx/sites-available/orderflow
# Adjust server_name and SSL paths for your domain.

upstream orderflow_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name orderflow.example.com;

    # Redirect to HTTPS (uncomment after TLS setup)
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/orderflow-access.log;
    error_log /var/log/nginx/orderflow-error.log;

    # Web SPA static files
    root /opt/orderflow/current/apps/web/dist;
    index index.html;

    # API reverse proxy
    location /api/ {
        proxy_pass http://orderflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health endpoints (no auth required)
    location /health {
        proxy_pass http://orderflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://orderflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

